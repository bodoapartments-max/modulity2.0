name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          VITE_APP_ENV: test
          VITE_APP_NAME: Modulity CI
          VITE_FIREBASE_API_KEY: ci-test-key
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456'
          VITE_FIREBASE_APP_ID: '1:123:web:ci'
          VITE_IDENTITY_PROVIDER: firebase
          VITE_MAX_CONNECTIONS: '5'

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_APP_NAME: Modulity
          VITE_FIREBASE_API_KEY: ci-test-key
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-project
          VITE_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456'
          VITE_FIREBASE_APP_ID: '1:123:web:ci'
          VITE_IDENTITY_PROVIDER: firebase
          VITE_MAX_CONNECTIONS: '5'
